name: Smart Retail Build Pipeline

on:

 push:

   branches:

     - main

jobs:

 build:

   runs-on: ubuntu-latest

   steps:

   - name: Checkout Code

     uses: actions/checkout@v4

   - name: Install Node

     uses: actions/setup-node@v4

     with:

       node-version: 20

   - name: Install Dependencies

     run: |
       cd services/catelog-service


       npm install

   - name: Run Tests

     run: |

       cd services/catelog-service

       npm test

   # NEW: Log into Docker Hub using your GitHub Secrets
   - name: Log in to Docker Hub
     uses: docker/login-action@v3
     with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    # UPDATED: Build and Push the image to Docker Hub
   - name: Build and Push Docker Image
     run: |
        cd services/catelog-service
        # Define image tags using your Docker Hub username
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/catalog-service"
        VERSION_TAG="${{ github.run_number }}"
        # Build the image with both the unique run number and 'latest' tags
        docker build -t $IMAGE_NAME:$VERSION_TAG -t $IMAGE_NAME:latest .
        # Push both tags to your public Docker Hub repository
        docker push $IMAGE_NAME:$VERSION_TAG
        docker push $IMAGE_NAME:latest
